{% load static %}

<style>
  /* Estilos para a caixa de diálogo modal */
  .modal {
    display: none; /* Inicia oculta */
    position: fixed; /* Posição fixa na janela de visualização */
    z-index: 1; /* Z-index para ficar acima do conteúdo */
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto; /* Habilita o scroll quando necessário */
    background-color: rgba(0,0,0,0.4); /* Fundo semi-transparente */
    padding-top: 60px; /* Espaçamento para o cabeçalho da caixa de diálogo */
  }

  /* Estilos para o conteúdo da caixa de diálogo */
  .modal-content {
    background-color: #3f3e3e;
    margin: auto;
    padding: 20px;
    border: 1px solid #313030;
    width: 80%;
    max-width: 600px;
  }

  /* Estilos para o botão de fechar a caixa de diálogo */
  .close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
  }

  /* Estilos para o botão de fechar a caixa de diálogo ao passar o mouse sobre ele */
  .close:hover,
  .close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
  }


.btn-secondary{
  padding-left: 0.5em;
  padding-right: 0.5em;
  padding-bottom: 0.2em;
  padding-top: 0.2em;
  border-radius: 10px;
  background-color: #b8d6ff;
  color: rgb(1, 43, 104);
  text-shadow: none;
  font-size: 0.8rem;
}

.btn-secondary:hover,
.btn-secondary:focus {
  border-radius: 10px;
  background-color: #008CBA;
  color: white;;
  text-shadow: none;
  font-size: 0.8rem;
}

</style>

<!-- Função para abrir a caixa de diálogo modal schema -->
<script>
  function abrirModal() {
    document.getElementById("myModal").style.display = "block";
  }

  function fecharModal() {
    document.getElementById("myModal").style.display = "none";
  }
</script>

  <div class="descricao_schema">  
    Schemas: {{ status_object.description }}
    <button type="button" class="btn-secondary" onclick="abrirModal()"> Ver schema</button>
  </div>  

  <!-- Mostra o schema -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <h2>{{ status_object.description }}</h2>
      <pre> {{ status_object.schema.items }} </pre>
    </div>
  </div>

  </br>
  <div class="p_schema"> 
    <input type="checkbox" id="count" name="ordem" value="Schema:{{ status_object.description }}">
    Validar contrato: {{ status_object.description }}
  </div>
