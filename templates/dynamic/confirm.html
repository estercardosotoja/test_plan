{% extends 'base.html' %}
{% block content %}
  <h1> Opções selecionadas </h1>
  <form method="post" action="{% url 'download' %}"  enctype="application/x-www-form-urlencoded">
     {% csrf_token %}

    <h2> Paths selecionados: </h2>
     {{ selected_paths }}
    <h2> Verbos selecionados: </h2>
         {{ selected_verbs }}
         {{ msg }}
    <div class="form_confirmar">
      <input type="submit" value="Confirma!">
    </div>
  </form>


{% endblock %}
